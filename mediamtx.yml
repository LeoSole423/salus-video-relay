logLevel: info

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: false
hls: false
webrtc: false
srt: false
moq: false

authMethod: internal
authInternalUsers:
  - user: nvr_salus
    permissions:
      - action: read
        path: "~^salus(-ptz|-trasera)?$"
  - user: relay_publisher
    permissions:
      - action: publish
        path: "~^salus(-ptz|-trasera)?$"

pathDefaults:
  alwaysAvailable: true
  record: false

paths:
  salus:
    alwaysAvailableFile: /slates/salus.mp4
  salus-ptz:
    alwaysAvailableFile: /slates/salus-ptz.mp4
  salus-trasera:
    alwaysAvailableFile: /slates/salus-trasera.mp4
